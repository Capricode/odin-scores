<!DOCTYPE html>
<html>

<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A score keeping app for the Odin card game from Helvetiq">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Odin Score Keeper">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Odin Score Keeper</title>
  <link rel="manifest" href="manifest.json">

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background-color: #000000;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    /* Prevent body from showing during resize */
    body {
      position: relative;
    }

    /* Ensure Flutter view takes full space */
    flt-glass-pane {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
    }

    #loading {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background-color: #000000;
      z-index: 9999;
    }

    #loading-text {
      margin-top: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      font-size: 18px;
      color: #999;
    }

    .loader {
      border: 4px solid #333;
      border-top: 4px solid #673ab7;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    /* Hide loading once Flutter is ready */
    body.flutter-loaded #loading {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
  </style>
</head>

<body>
  <div id="loading">
    <div class="loader"></div>
    <div id="loading-text">Loading Odin Score Keeper...</div>
  </div>

  <script>
    // Remove the loading overlay after Flutter renders the first frame.
    window.addEventListener('flutter-first-frame', function () {
      document.body.classList.add('flutter-loaded');
      setTimeout(function () {
        var loadingEl = document.getElementById('loading');
        if (loadingEl) {
          loadingEl.remove();
        }
      }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
