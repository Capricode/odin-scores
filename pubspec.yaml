name: odin_score_keeper
description: A score keeping app for the Odin card game from Helvetiq
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  confetti: ^0.7.0
  shared_preferences: ^2.3.2
  flutter_onnxruntime: ^1.9.0
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/boxes/
